name: CI Pipeline

# Когда запускать? При каждом пуше в main и при создании Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest # Запускаем на свежей Ubuntu

    # Поднимаем базу данных PostgreSQL "на лету" для тестов
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: shortener_db
        ports:
          - 5432:5432
        # Ждем, пока БД полностью запустится, прежде чем начать тесты
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # На Github используем стабильный Python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Применяем миграции к тестовой БД перед тестами
    - name: Run migrations
      env:
        DATABASE_URL: postgresql+asyncpg://shortener:mypassword@localhost:5432/shortener_db
      run: alembic upgrade head

    # Запускаем сами тесты
    - name: Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://shortener:mypassword@localhost:5432/shortener_db
      run: pytest -v
